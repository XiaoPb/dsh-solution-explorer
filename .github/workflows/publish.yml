# Publish the personal fork's plugin build to npm as @xiaopb/dsh-solution-explorer.
#
# Lives on the personal branch (xiaopb/main) only — the upstream PR carries the
# fixes, never this pipeline. Publish happens when the version in package.json
# is not yet on the registry, so plain branch pushes stay green; cut a tag
# (v*-xiaopb*) or run manually to force a release attempt.
name: publish

on:
  push:
    branches:
      - xiaopb/main
    tags:
      - "v*-xiaopb*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Resolve version
        id: ver
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.ver.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report
        run: |
          if [ "${{ steps.ver.outputs.published }}" = "true" ]; then
            echo "${{ steps.ver.outputs.name }}@${{ steps.ver.outputs.version }} is already on npm — nothing to publish."
          else
            echo "Published ${{ steps.ver.outputs.name }}@${{ steps.ver.outputs.version }}."
          fi
